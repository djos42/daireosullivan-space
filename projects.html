<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects — DOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0b;
      color: #e8e8ec;
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .image-wrap {
      position: relative;
      max-width: 580px;
      width: 100%;
      margin-bottom: 2.5rem;
    }

    .image-wrap img {
      width: 100%;
      display: block;
      border: 1px solid #1e1e24;
      filter: grayscale(25%) brightness(0.85);
    }

    .image-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(10,10,11,0.92));
      padding: 2rem 1.5rem 1.2rem;
      text-align: left;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b6b78;
    }

    .headline {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.8rem;
    }

    .headline span { color: #e8f04a; }

    .subline {
      font-size: 0.78rem;
      color: #6b6b78;
      line-height: 1.8;
      margin-bottom: 2rem;
      max-width: 380px;
    }

    .net {
      display: inline-block;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e8f04a;
      border: 1px solid #e8f04a;
      padding: 0.3rem 0.9rem;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .back {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b6b78;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back:hover { color: #e8f04a; }
  </style>
</head>
<body>

  <div class="image-wrap">
    <img src="construction.png" alt="Under construction">
    <div class="image-caption">Integration facility, circa 1984 — things take time</div>
  </div>

  <div class="net">NET March 2026</div>

  <h1 class="headline">Page under<br><span>construction.</span></h1>

  <p class="subline">
    Projects are being assembled, integrated, and tested.<br>
    Check back soon — or don't, and be pleasantly surprised.
  </p>

  <a href="index.html" class="back">← Return to base</a>

</body>
</html>
